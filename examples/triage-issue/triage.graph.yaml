apiVersion: flowgraph/v1
kind: Graph
metadata:
  name: triage-issue
  description: >
    Triage an inbound issue: classify it as bug/feature/question,
    then create a ticket via the mock-create-ticket skill.

state:
  channels:
    issue:
      type: object
      description: The inbound issue payload
    label:
      type: string
      default: ""
      description: Classified label (bug | feature | question)
    ticket:
      type: object
      description: Created ticket

config:
  vars:
    project: "DEMO"

nodes:
  - id: classify
    type: function
    with:
      fn: classifyIssue
      output: { to: label }
    input:
      title: "{{ state.issue.title }}"
      body:  "{{ state.issue.body }}"

  - id: route
    type: router
    with:
      mode: rules
      routes:
        - name: bug
          when: "{{ state.label == 'bug' }}"
          to: create-ticket
        - name: feature
          when: "{{ state.label == 'feature' }}"
          to: create-ticket
        - name: default
          default: true
          to: create-ticket

  - id: create-ticket
    type: skill
    uses: skills/mock-create-ticket
    input:
      project:     "{{ config.vars.project }}"
      type:        "{{ state.label }}"
      title:       "{{ state.issue.title }}"
      description: "{{ state.issue.body }}"
    with:
      output: { to: ticket }

edges:
  - { from: START,          to: classify }
  - { from: classify,       to: route }
  # route → create-ticket is chosen by the router's with.routes (Command.goto);
  # no duplicate branch edge is required.
  - { from: create-ticket, to: END }

runtime:
  checkpoint: { enabled: false }
