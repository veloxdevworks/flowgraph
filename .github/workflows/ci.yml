name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Typecheck, Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm@11 (packageManager) requires Node >= 22.13
        node-version: [22.x]

    # Postgres for the checkpointer and memory integration tests
    # (they are skipped when FLOWGRAPH_TEST_POSTGRES_URL is unset).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowgraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FLOWGRAPH_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/flowgraph_test

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate examples
        run: |
          for f in examples/**/*.graph.yaml; do
            echo "Validating $f"
            node packages/cli/dist/bin.js validate "$f"
          done
        continue-on-error: true
